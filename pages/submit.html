<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投稿 · 研习录</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .submit-form {
            margin-top: 3rem;
        }

        .form-group {
            margin-bottom: 1.75rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #9e998f;
            font-size: 0.9375rem;
            letter-spacing: 0.04em;
        }

        .form-group input[type="text"],
        .form-group input[type="file"],
        .form-group textarea {
            width: 100%;
            background-color: #141414;
            border: 1px solid #262626;
            border-radius: 2px;
            color: #e8e4dc;
            padding: 0.75rem;
            font-family: inherit;
            font-size: 1rem;
            line-height: 1.6;
            transition: border-color 0.25s ease;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="file"]:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4a4742;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        #content {
            min-height: 320px;
            font-family: "SFMono-Regular", "Menlo", "Consolas", "Noto Sans SC", monospace;
            font-size: 0.9375rem;
        }

        .hint {
            margin-top: 0.375rem;
            font-size: 0.8125rem;
            color: #6b665d;
        }

        .error {
            display: none;
            margin-top: 0.375rem;
            font-size: 0.875rem;
            color: #a85e5e;
        }

        button[type="submit"] {
            background-color: #a85e5e;
            color: #f0ece4;
            border: none;
            border-radius: 2px;
            padding: 0.875rem 1.75rem;
            font-family: inherit;
            font-size: 1rem;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: background-color 0.25s ease;
        }

        button[type="submit"]:hover,
        button[type="submit"]:focus {
            background-color: #c98a8a;
        }
    </style>
</head>
<body>
    <main>
        <nav class="site-nav" aria-label="主导航">
            <a href="../index.html">首页</a> · <a href="../categories.html">分类</a>
        </nav>

        <h1>投稿</h1>
        <p class="subtitle">分享你的 AI 学习笔记</p>

        <form id="submitForm" class="submit-form" action="/api/submit" method="POST" enctype="multipart/form-data" novalidate>
            <div class="form-group">
                <label for="title">标题</label>
                <input type="text" id="title" name="title" required maxlength="120" placeholder="文章标题">
                <span class="error" id="titleError">请输入标题</span>
            </div>

            <div class="form-group">
                <label for="category">分类</label>
                <input type="text" id="category" name="category" required maxlength="40" placeholder="例如：基础概念 / 实战技巧">
                <span class="error" id="categoryError">请输入分类</span>
            </div>

            <div class="form-group">
                <label for="author">作者昵称</label>
                <input type="text" id="author" name="author" required maxlength="40" placeholder="你的昵称">
                <span class="error" id="authorError">请输入作者昵称</span>
            </div>

            <div class="form-group">
                <label for="summary">摘要</label>
                <textarea id="summary" name="summary" required maxlength="300" rows="3" placeholder="用一两句话概括文章要点"></textarea>
                <span class="error" id="summaryError">请输入摘要</span>
            </div>

            <div class="form-group">
                <label for="content">正文（Markdown）</label>
                <textarea id="content" name="content" required rows="16" placeholder="在此输入 Markdown 正文..."></textarea>
                <span class="error" id="contentError">请输入正文</span>
            </div>

            <div class="form-group">
                <label for="images">图片上传</label>
                <input type="file" id="images" name="images" multiple accept="image/*">
                <p class="hint">最多 5 张，每张不超过 2MB</p>
                <span class="error" id="imagesError"></span>
            </div>

            <button type="submit">提交投稿</button>
        </form>
    </main>

    <script>
        (function () {
            const form = document.getElementById('submitForm');
            const MAX_FILES = 5;
            const MAX_SIZE = 2 * 1024 * 1024;

            function setError(id, message) {
                const el = document.getElementById(id);
                if (message) {
                    el.textContent = message;
                    el.style.display = 'block';
                } else {
                    el.style.display = 'none';
                }
            }

            form.addEventListener('submit', function (event) {
                let valid = true;

                ['title', 'category', 'author', 'summary', 'content'].forEach(function (name) {
                    const field = document.getElementById(name);
                    if (!field.value.trim()) {
                        setError(name + 'Error', '请填写此项');
                        valid = false;
                    } else {
                        setError(name + 'Error', '');
                    }
                });

                const files = document.getElementById('images').files;

                if (files.length > MAX_FILES) {
                    setError('imagesError', '最多只能上传 ' + MAX_FILES + ' 张图片');
                    valid = false;
                } else {
                    let oversized = false;
                    for (let i = 0; i < files.length; i++) {
                        if (files[i].size > MAX_SIZE) {
                            oversized = true;
                            break;
                        }
                    }
                    if (oversized) {
                        setError('imagesError', '每张图片大小不能超过 2MB');
                        valid = false;
                    } else {
                        setError('imagesError', '');
                    }
                }

                if (!valid) {
                    event.preventDefault();
                }
            });
        })();
    </script>
</body>
</html>
